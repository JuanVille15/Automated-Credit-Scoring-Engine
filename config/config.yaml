base_models:
  logreg:
    class: LogistcRegression
    params:
      max_iter: 1000
  
  random_forest:
    class: RandomForestClassifier
    params:
      random_state: 42
      n_jobs: -1
  
  xgboost:
    class: XGBClassifier
    params:
      eval_metric: logloss
      random_state: 42
      n_jobs: -1

  knn:
    class: KNeighborsClassifier
    params:
      weights: distance
      n_jobs: -1

  svm:
    class: SVC
    params:
      kernel: rbf
      class_weight: balanced
      random_state: 42
